<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="0.55" stop-color="#3E5BD9"/>
      <stop offset="1" stop-color="#273B96"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="40" y="40" width="944" height="944" rx="224"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#041024" flood-opacity="0.5"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 主体 squircle -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- 顶部玻璃高光 -->
    <rect x="40" y="40" width="944" height="944" fill="url(#gloss)"/>
    <rect x="40" y="40" width="944" height="6" fill="#ffffff" opacity="0.2"/>

    <!-- 玻璃代码窗口 -->
    <g filter="url(#winShadow)">
      <rect x="262" y="312" width="500" height="400" rx="44" fill="#ffffff" opacity="0.15"/>
      <rect x="262" y="312" width="500" height="400" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4"/>
    </g>

    <!-- 红绿灯（呼应 macOS 原生窗口） -->
    <circle cx="300" cy="352" r="13" fill="#FF5F57"/>
    <circle cx="338" cy="352" r="13" fill="#FEBC2E"/>
    <circle cx="376" cy="352" r="13" fill="#28C840"/>

    <!-- 代码行 -->
    <rect x="300" y="406" width="380" height="20" rx="10" fill="#ffffff" opacity="0.9"/>
    <rect x="300" y="446" width="300" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
    <rect x="300" y="486" width="340" height="20" rx="10" fill="#8FD0FF" opacity="0.85"/>
    <rect x="300" y="526" width="250" height="20" rx="10" fill="#ffffff" opacity="0.45"/>
    <rect x="300" y="566" width="360" height="20" rx="10" fill="#ffffff" opacity="0.75"/>
    <!-- 行尾光标 -->
    <rect x="672" y="566" width="12" height="20" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
