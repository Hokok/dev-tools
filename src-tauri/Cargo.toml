[package]
name = "devbox"
version = "0.1.0"
description = "Dev Toolbox - JSON / text utilities"
authors = ["devbox"]
edition = "2021"

[lib]
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
